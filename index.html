<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>LifeLink – Smart Transfusion &amp; Monitoring</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#06121a;--c:rgba(15,37,49,.8);--b:#1f4658;--t:#e8f4f6;--m:#8db1ba;--a:#2dd4bf;--r:#fb5f7a;--w:#fbbf24;--g:#4ade80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.55 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--t);background:radial-gradient(900px 520px at 88% -8%,#0e4a52,transparent 60%),radial-gradient(700px 520px at -8% 108%,#3b1427,transparent 58%),var(--bg);background-attachment:fixed}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--b);background:rgba(6,18,26,.85);backdrop-filter:blur(10px);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{display:flex;gap:10px;align-items:center;font-weight:700;font-size:19px;cursor:pointer}.logo svg{width:30px;height:30px}.logo small{display:block;font-size:11px;color:var(--m);font-weight:400}
nav{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;cursor:pointer}
nav button,aside button{background:none;border:1px solid transparent;color:var(--m);padding:8px 14px;border-radius:10px;text-align:left}
nav button:hover,aside button:hover{color:var(--t);background:#ffffff0d}nav button.on,aside button.on{color:#04211e;background:var(--a);font-weight:600}
.lay{display:flex;gap:20px;max-width:1180px;margin:0 auto;padding:22px}
aside{width:210px;flex:none;display:flex;flex-direction:column;gap:4px;position:sticky;top:84px;align-self:flex-start}aside[hidden]{display:none}
main{flex:1;min-width:0;background:var(--c);border:1px solid var(--b);border-radius:18px;padding:26px;backdrop-filter:blur(8px);box-shadow:0 20px 50px #0006;min-height:60vh}
h2{margin:0 0 14px;font-size:24px;font-weight:600}h3{margin:22px 0 10px;font-size:17px;color:var(--a)}.m{color:var(--m)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.w{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--m)}
input,select,textarea{font:inherit;color:var(--t);background:#081a24;border:1px solid var(--b);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--a);box-shadow:0 0 0 3px #2dd4bf33}
.btn{background:linear-gradient(135deg,#2dd4bf,#38bdf8);color:#032a2c;border:0;border-radius:10px;padding:11px 22px;font-weight:700}.btn:hover{filter:brightness(1.1)}.btn.red{background:linear-gradient(135deg,#fb5f7a,#f97316);color:#fff}
.tw{overflow-x:auto;margin-top:10px;border:1px solid var(--b);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #16394a;white-space:nowrap}th{background:#0b2431;color:var(--m);font-weight:600}tr:last-child td{border:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}.kv div{background:#0a202c;border:1px solid var(--b);border-radius:12px;padding:10px 14px}.kv span{display:block;font-size:12px;color:var(--m)}.kv b{font-weight:600}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:#2dd4bf22;color:var(--a)}.bd.bad{background:#fb5f7a22;color:var(--r)}.bd.warn{background:#fbbf2422;color:var(--w)}.bd.ok{background:#4ade8022;color:var(--g)}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));max-width:340px;padding:12px 16px;border-radius:12px;background:#2a1019;border:1px solid var(--r);z-index:9;box-shadow:0 10px 30px #0008}.toast.ok{background:#0b2a22;border-color:var(--g)}
.cert{margin-top:18px;border:1px solid var(--a);border-radius:16px;padding:20px;background:linear-gradient(160deg,#0c3a40,#0a202c)}.cert.no{border-color:var(--r);background:linear-gradient(160deg,#3a1220,#0a202c)}.cert h3{margin-top:0}
.tl{margin:14px 0;padding-left:18px;border-left:2px solid var(--b)}.tl div{margin-bottom:14px;padding-left:12px}.tl b{display:block}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0}.bar span{width:46px;color:var(--m)}.bar div{flex:1;height:10px;background:#0a202c;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--r))}.bar b{width:34px;text-align:right}
.hero{padding:10px 0 22px}.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.1;margin:0 0 12px;font-weight:700}.hero p{max-width:560px;color:var(--m);margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px}
.cards button{background:#0a202c;border:1px solid var(--b);border-radius:16px;padding:18px;color:var(--t);text-align:left}.cards button:hover{border-color:var(--a);background:#0d2a38}.cards b{display:block;font-size:17px;margin:6px 0 4px}.cards span{color:var(--m);font-size:13px}
.ecg{position:fixed;left:0;right:0;bottom:0;height:90px;opacity:.16;pointer-events:none;z-index:0}.ecg path{stroke-dasharray:1400;animation:d 7s linear infinite}@keyframes d{from{stroke-dashoffset:1400}to{stroke-dashoffset:-1400}}
main,header{position:relative;z-index:1}
@media(max-width:760px){.lay{flex-direction:column;padding:12px}aside{width:100%;flex-direction:row;overflow-x:auto;position:static}aside button{white-space:nowrap}main{padding:18px}}
@media(prefers-reduced-motion:reduce){.ecg path{animation:none}}

@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#12181c;--sf:#192127;--sf2:#1f2931;--b:#2b3740;--t:#e8eef1;--m:#8fa0aa;--a:#f2793a;--a2:#c8602a;--r:#f0555a;--w:#f0b23a;--g:#47c28a;--bl:#6aa6e0;--c:#192127;--sh:0 1px 2px #0006,0 24px 48px -28px #000a;--gl:rgba(31,41,49,.75)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#12181c;--sf:#192127;--sf2:#1f2931;--b:#2b3740;--t:#e8eef1;--m:#8fa0aa;--a:#f2793a;--a2:#c8602a;--r:#f0555a;--w:#f0b23a;--g:#47c28a;--bl:#6aa6e0;--c:#192127;--sh:0 1px 2px #0006,0 24px 48px -28px #000a;--gl:rgba(31,41,49,.75)}
body{font-family:Outfit,Inter,"Segoe UI",system-ui,sans-serif;font-size:15px;color:var(--t);background:radial-gradient(800px 460px at 95% -8%,color-mix(in srgb,var(--a) 12%,transparent),transparent 62%),radial-gradient(700px 480px at -8% 108%,color-mix(in srgb,var(--bl) 9%,transparent),transparent 60%),var(--bg)}
header{margin:14px auto 0;max-width:1180px;width:calc(100% - 28px);border:1px solid var(--b);border-radius:22px;background:var(--gl);backdrop-filter:blur(14px);box-shadow:var(--sh);top:calc(10px + env(safe-area-inset-top,0px))}
.logo{gap:12px;letter-spacing:-.01em;font-size:20px;line-height:1.15}.logo small{color:var(--m);font-size:11px;letter-spacing:.02em}
.logo-img{background:var(--logo) center/cover no-repeat;aspect-ratio:1;height:46px;border-radius:14px;flex:none;box-shadow:0 0 0 1px #0000000f,0 8px 18px -10px var(--r)}.logo-img--lg{height:84px;border-radius:24px}.logo-img--sm{height:28px;border-radius:9px}
.blood-drop-pulse{width:9px;height:9px;margin-left:6px;border:1.5px solid var(--r);border-radius:0 50% 50% 50%;transform:rotate(45deg);background:linear-gradient(var(--r),var(--r)) left bottom/100% 0% no-repeat;opacity:.5;animation:dropfill 5s ease-in-out infinite}
@keyframes dropfill{0%,55%{background-size:100% 0%;box-shadow:none;opacity:.45}75%{background-size:100% 100%;box-shadow:0 0 9px color-mix(in srgb,var(--r) 55%,transparent);opacity:.95}92%{background-size:100% 100%;box-shadow:none;opacity:.6}100%{background-size:100% 0%;opacity:.35}}
nav{background:var(--sf);border:1px solid var(--b);border-radius:16px;padding:4px}
nav button,aside button{color:var(--m);font-weight:500;border-radius:12px}nav button:hover,aside button:hover{color:var(--t);background:color-mix(in srgb,var(--a) 9%,transparent)}
nav button.on,aside button.on{color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));box-shadow:0 8px 16px -9px var(--a)}
.lay{padding:18px 14px 22px}aside{background:var(--sf);border:1px solid var(--b);border-radius:22px;padding:10px;box-shadow:var(--sh);top:96px}
main{background:var(--sf);border:1px solid var(--b);border-radius:28px;box-shadow:var(--sh);backdrop-filter:none;padding:30px}
h2{font-weight:600;letter-spacing:-.02em;font-size:26px}h3{color:var(--t);font-weight:600;letter-spacing:-.01em}.m{color:var(--m)}
label{color:var(--m);font-weight:500}input,select,textarea{background:var(--sf2);color:var(--t);border:1px solid var(--b);border-radius:14px;padding:11px 14px}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 22%,transparent)}
.btn{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;border-radius:999px;padding:12px 26px;box-shadow:0 12px 20px -12px var(--a)}.btn.red{background:linear-gradient(135deg,var(--r),var(--a))}
.tw{background:var(--sf2);border:1px solid var(--b);border-radius:18px}th{background:var(--sf);color:var(--m);font-size:12px;letter-spacing:.05em;text-transform:uppercase}th,td{border-bottom:1px solid var(--b)}
.kv div{background:var(--gl);border:1px solid var(--b);border-radius:18px;padding:14px 16px;box-shadow:0 1px 2px #1c23270a}.kv span{color:var(--m)}.kv b{font-size:22px;font-weight:500;letter-spacing:-.01em}
.bd{border-radius:999px;background:color-mix(in srgb,currentColor 13%,transparent);color:var(--a)}.bd.bad{color:var(--r)}.bd.warn{color:var(--w)}.bd.ok{color:var(--g)}
.toast{background:var(--sf2);color:var(--t);border-radius:16px;border-color:var(--r);box-shadow:var(--sh)}.toast.ok{border-color:var(--g)}
.cert{border-color:var(--a);border-radius:22px;background:linear-gradient(160deg,color-mix(in srgb,var(--a) 10%,var(--sf2)),var(--sf2))}.cert.no{border-color:var(--r);background:linear-gradient(160deg,color-mix(in srgb,var(--r) 10%,var(--sf2)),var(--sf2))}
.tl{border-left-color:var(--b)}.bar span{color:var(--m)}.bar div{background:var(--sf2);border:1px solid var(--b)}.bar i{background:linear-gradient(90deg,var(--a2),var(--a))}
.hero{display:grid;grid-template-columns:1.05fr .95fr;grid-template-areas:"lg art" "tx art";gap:18px 28px;align-items:center;padding:0 0 8px}.hero>.logo-img{grid-area:lg;align-self:end}.hero>div:not(.logo-img){grid-area:tx;align-self:start}.hero h1{font-weight:600;letter-spacing:-.03em;line-height:1.08}.hero p{color:var(--m);font-size:16px}
.eyebrow{display:inline-block;margin-bottom:10px;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--a);background:color-mix(in srgb,var(--a) 12%,transparent)}
.heart-art{grid-area:art;position:relative;min-height:340px;border-radius:26px;background:radial-gradient(circle at 55% 40%,var(--sf2),color-mix(in srgb,var(--b) 70%,var(--sf)));border:1px solid var(--b);overflow:hidden}
.heart-art svg{position:absolute;inset:12px 0 0;margin:auto;height:92%;width:auto;filter:drop-shadow(0 22px 24px #7a1d1244);animation:beat 5s ease-in-out infinite;transform-origin:50% 62%}
@keyframes beat{0%,100%{transform:scale(1)}8%{transform:scale(1.025)}16%{transform:scale(1)}24%{transform:scale(1.015)}32%{transform:scale(1)}}
.chip{position:absolute;padding:10px 16px;border-radius:16px;background:var(--gl);backdrop-filter:blur(10px);border:1px solid var(--b);box-shadow:var(--sh);font-size:12px;color:var(--m)}.chip b{display:block;font-size:22px;font-weight:500;color:var(--t)}.chip.l{left:14px;bottom:16px}.chip.r{right:14px;top:18px}
.cards button{background:var(--gl);border:1px solid var(--b);border-radius:20px;color:var(--t);transition:transform .2s,box-shadow .2s,border-color .2s}.cards button:hover{border-color:var(--a);transform:translateY(-3px);box-shadow:var(--sh);background:var(--sf2)}.cards span{color:var(--m)}
.board{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-top:22px}.board h4{margin:0 0 4px;font-weight:500;font-size:14px;color:var(--t);display:flex;justify-content:space-between;gap:8px}.board h4 em{font-style:normal;color:var(--m);font-size:12px}
.panel{background:var(--gl);border:1px solid var(--b);border-radius:22px;padding:16px 18px;box-shadow:0 1px 2px #1c23270a;min-width:0}.panel svg{display:block;width:100%;height:150px}.panel .big{font-size:26px;font-weight:500}.panel .big small{font-size:14px;color:var(--m);font-weight:400}
.vit{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vit div{background:var(--sf);border:1px solid var(--b);border-radius:16px;padding:10px 12px;font-size:12px;color:var(--m)}.vit b{display:block;margin-top:8px;font-size:20px;font-weight:500;color:var(--t)}.vit b small{font-size:12px;color:var(--m);font-weight:400}
.ecg-live path{stroke:var(--a);stroke-width:2.4;fill:none;stroke-dasharray:1400;animation:d 7s linear infinite;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--a) 55%,transparent))}
.ecg{opacity:.34}.ecg path{stroke:var(--a);stroke-width:2.6;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--a) 60%,transparent))}
.about-page{max-width:900px}.about-lead{font-size:17px;color:var(--m);max-width:680px;margin:0 0 6px}
.about-grid,.founders{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-top:18px}
.about-card,.founder-card{background:var(--gl);border:1px solid var(--b);border-radius:22px;padding:22px;box-shadow:0 1px 2px #1c23270a}.about-card h3{margin-top:0}.about-card p{margin:0}
